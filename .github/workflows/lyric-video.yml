name: Lyric Video Render
on:
  workflow_dispatch:
    inputs:
      job:
        description: "URL payload JSON dari CDN"
        required: true
        type: string
      job_id:
        description: "ID job unik"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Runner ubuntu-latest sudah menyediakan ffmpeg + pustaka cairo/pango.
      # apt-get update sering menggantung di mirror, jadi hanya jalankan jika
      # benar-benar belum ada, dengan batas waktu 5 menit.
      - name: Pastikan ffmpeg tersedia
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "ffmpeg belum ada, memasang..."
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi

      # canvas@3 memakai prebuilt binary, jadi tidak perlu libcairo2-dev dll.
      - name: Install node deps
        run: npm install --omit=dev --no-audit --no-fund

      - name: Verifikasi modul render
        run: |
          node -e "require('canvas'); console.log('canvas OK')"
          node -e "const { resolveFont } = require('./lib/lyric-fonts'); for (const s of ['Line Without a Hook','こんにちは','안녕하세요','你好','สวัสดี','नमस्ते','مرحبا','שלום','Привет']) console.log('FONT=' + resolveFont(s, 44, 'bold'))"

      - name: Render lyric video
        id: render
        env:
          LYRIC_JOB_URL: ${{ inputs.job }}
          CDN_API_BASE_URL: ${{ vars.CDN_API_BASE_URL || 'https://cdn.patrickbotz.com' }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
        run: |
          node scripts/lyric-video-worker.js > render.log 2>&1
          cat render.log
          echo "url=$(grep -o 'RESULT_URL=.*' render.log | head -1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Simpan URL hasil untuk panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          RESULT_URL: ${{ steps.render.outputs.url }}
        run: |
          if [ -z "$RESULT_URL" ]; then
            echo "::error::Render selesai tapi URL hasil kosong — cek log langkah Render"
            exit 1
          fi
          mkdir -p lyric-video-results
          printf '{"jobId":"%s","url":"%s"}\n' "$JOB_ID" "$RESULT_URL" > "lyric-video-results/$JOB_ID.json"
          git config user.name "lyric-render-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "lyric-video-results/$JOB_ID.json"
          git commit -m "lyric-video result $JOB_ID" || true
          git push
