name: Lyric Video Render
on:
  workflow_dispatch:
    inputs:
      job:
        description: "URL payload JSON dari CDN"
        required: true
        type: string
      job_id:
        description: "ID job unik"
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install node deps
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Render lyric video
        id: render
        env:
          LYRIC_JOB_URL: ${{ inputs.job }}
          CDN_API_BASE_URL: ${{ vars.CDN_API_BASE_URL || 'https://cdn.patrickbotz.com' }}
          CDN_API_KEY: ${{ secrets.CDN_API_KEY }}
        run: |
          node scripts/lyric-video-worker.js > render.log 2>&1
          cat render.log
          echo "url=$(grep -o 'RESULT_URL=.*' render.log | head -1 | cut -d= -f2-)" >> "$GITHUB_OUTPUT"

      - name: Simpan URL hasil untuk panel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          RESULT_URL: ${{ steps.render.outputs.url }}
        run: |
          if [ -z "$RESULT_URL" ]; then
            echo "::error::Render selesai tapi URL hasil kosong — cek log langkah Render"
            exit 1
          fi
          mkdir -p lyric-video-results
          printf '{"jobId":"%s","url":"%s"}\n' "$JOB_ID" "$RESULT_URL" > "lyric-video-results/$JOB_ID.json"
          git config user.name "patrickbotz-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "lyric-video-results/$JOB_ID.json"
          git commit -m "lyric-video result $JOB_ID" || true
          git push
